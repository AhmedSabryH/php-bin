name: Build PHP (Windows)

permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:
    inputs:
      version:
        description: 'PHP version to build'
        type: choice
        options:
          - all
          - "8.3"
          - "8.4"
          - "8.5"
        default: all

env:
  SPC_VERSION: 2.8.5
  SPC_BUILD_OS: win
  PHP_SDK_PATH: ${{ github.workspace }}/../static-php-cli/php-sdk-binary-tools
  R2_PREFIX: ${{ format('{0}/', github.ref_name) }}
  R2_ENDPOINT: https://713f4e1d515cf082921cdf5122bf1739.r2.cloudflarestorage.com
  R2_BUCKET: nativephplibs

jobs:
  build:
    name: ${{ matrix.version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON((github.event.inputs.version || 'all') == 'all' && '["8.3","8.4","8.5"]' || format('["{0}"]', github.event.inputs.version)) }}
        os: [windows-2025]
        include:
          - os: windows-2025
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup system PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: pecl, composer
          extensions: curl, openssl, mbstring, sodium, tokenizer, filter
          ini-values: memory_limit=-1

      - name: Setup SPC from source
        working-directory: ${{ github.workspace }}/..
        run: |
          git clone --branch ${{ env.SPC_VERSION }} --depth 1 https://github.com/crazywhalecc/static-php-cli.git
          cd static-php-cli
          composer install --no-dev --no-interaction --ignore-platform-reqs

      - name: Diagnose SPC config structure
        working-directory: ${{ github.workspace }}/../static-php-cli
        shell: bash
        run: |
          echo "=== SPC version ==="
          cat VERSION 2>/dev/null || echo "no VERSION file"
          echo ""
          echo "=== config/ directory tree ==="
          find config -type f -name "*.json" | head -20
          echo ""
          echo "=== Is there config/ext.json? ==="
          ls -la config/ext.json 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "=== Is there config/pkg/ext/ ? ==="
          ls -la config/pkg/ext/ 2>/dev/null | head -10 || echo "NOT FOUND"
          echo ""
          echo "=== First 30 lines of config/ext.json (if exists) ==="
          head -30 config/ext.json 2>/dev/null || echo "no ext.json"

      - name: Inject beast configuration into SPC
        working-directory: ${{ github.workspace }}/../static-php-cli
        shell: bash
        run: |
          # Detect config structure
          if [ -f config/ext.json ]; then
            echo "Using monolithic config/ext.json and config/source.json"
            php -r '
              $extFile = "config/ext.json";
              $ext = json_decode(file_get_contents($extFile), true);
              if ($ext === null) { fwrite(STDERR, "ERROR: ext.json invalid JSON\n"); exit(1); }
              $ext["beast"] = [
                "type" => "external",
                "source" => "beast",
                "arg-type" => "enable",
                "support" => ["Windows" => "yes", "Linux" => "yes", "Darwin" => "yes"]
              ];
              file_put_contents($extFile, json_encode($ext, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
              
              $srcFile = "config/source.json";
              $src = json_decode(file_get_contents($srcFile), true);
              if ($src === null) { fwrite(STDERR, "ERROR: source.json invalid JSON\n"); exit(1); }
              $src["beast"] = [
                "type" => "git",
                "url" => "https://github.com/AhmedSabryH/my-beast.git",
                "rev" => "main",
                "path" => "beast"
              ];
              file_put_contents($srcFile, json_encode($src, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
              echo "Injected to monolithic JSON" . PHP_EOL;
            '
          elif [ -d config/pkg/ext ]; then
            echo "Using split YAML config/pkg/ext/ and config/pkg/source/"
            
            # Create beast.yml in config/pkg/ext/
            cat > config/pkg/ext/ext-beast.yml << 'EOF'
          beast:
            type: external
            source: beast
            arg-type: enable
            support:
              Windows: "yes"
              Linux: "yes"
              Darwin: "yes"
          EOF
            
            # Create beast source in config/pkg/source/
            cat > config/pkg/source/beast.yml << 'EOF'
          beast:
            type: git
            url: https://github.com/AhmedSabryH/my-beast.git
            rev: main
          EOF
            
            echo "Created YAML config files"
          else
            echo "ERROR: Unknown SPC config structure"
            find config -type f | head -50
            exit 1
          fi

      - name: Verify beast injection
        working-directory: ${{ github.workspace }}/../static-php-cli
        shell: bash
        run: |
          echo "=== Verification ==="
          if [ -f config/ext.json ]; then
            php -r "echo isset(json_decode(file_get_contents('config/ext.json'), true)['beast']) ? 'ext.json: OK' : 'ext.json: MISSING';"
            echo ""
            php -r "echo isset(json_decode(file_get_contents('config/source.json'), true)['beast']) ? 'source.json: OK' : 'source.json: MISSING';"
          fi
          if [ -d config/pkg/ext ]; then
            ls -la config/pkg/ext/ext-beast.yml 2>/dev/null && echo "ext-beast.yml: OK" || echo "ext-beast.yml: MISSING"
            ls -la config/pkg/source/beast.yml 2>/dev/null && echo "source/beast.yml: OK" || echo "source/beast.yml: MISSING"
          fi
      - name: Pre-stage beast source locally
        working-directory: ${{ github.workspace }}/../static-php-cli
        shell: bash
        run: |
          mkdir -p downloads/beast
          git clone --depth 1 https://github.com/AhmedSabryH/my-beast.git downloads/beast
          rm -rf downloads/beast/.git
          
          if [ ! -f downloads/.lock.json ]; then
            echo '{}' > downloads/.lock.json
          fi
          
          php -r '
            $lockFile = "downloads/.lock.json";
            $lock = json_decode(file_get_contents($lockFile), true) ?: [];
            $lock["beast"] = [
              "source_type" => "git",
              "dirname" => "beast",
              "hash" => "",
              "type" => "dir"
            ];
            file_put_contents($lockFile, json_encode($lock, JSON_PRETTY_PRINT));
          '
          
          echo "=== beast staged ==="
          ls -la downloads/beast/ | head -20

      - name: SPC doctor
        continue-on-error: true
        working-directory: ${{ github.workspace }}/../static-php-cli
        run: php bin/spc doctor

      - name: Read PHP extensions and libraries
        run: |
          $extensions = php -r "echo trim(file_get_contents('php-extensions.txt'));"
          $env:EXTENSIONS = $extensions
          $extHash = php -r "echo md5(getenv('EXTENSIONS'));"
          $libraries = php -r "echo trim(file_get_contents('php-libraries.txt'));"
          Add-Content -Path $env:GITHUB_ENV -Value "PHP_EXTENSIONS=$extensions"
          Add-Content -Path $env:GITHUB_ENV -Value "PHP_EXT_HASH=$extHash"
          Add-Content -Path $env:GITHUB_ENV -Value "PHP_LIBS=$libraries"

      - id: cache-spc-downloads
        uses: actions/cache@v4
        with:
          path: ../static-php-cli/downloads
          key: spc-downloads-${{ env.PHP_EXT_HASH }}

      - name: Download PHP extension sources
        if: steps.cache-spc-downloads.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/../static-php-cli
        env:
          SPC_IGNORE_BAD_HASH: "true"
        run: php bin/spc download --with-php=${{ matrix.version }} --for-extensions "${{ env.PHP_EXTENSIONS }}" --prefer-pre-built

      - name: Stage libzstd for curl extension
        working-directory: ${{ github.workspace }}/..
        env:
          ZSTD_VERSION: v1.5.7
        run: |
          Invoke-WebRequest -Uri "https://github.com/facebook/zstd/releases/download/${env:ZSTD_VERSION}/zstd-${env:ZSTD_VERSION}-win64.zip" -OutFile zstd.zip
          Expand-Archive -Path zstd.zip -DestinationPath .
          New-Item -ItemType Directory -Force -Path "static-php-cli/buildroot/lib", "static-php-cli/buildroot/include" | Out-Null
          Copy-Item "zstd-${env:ZSTD_VERSION}-win64/static/libzstd_static.lib" "static-php-cli/buildroot/lib/libzstd.lib"
          Copy-Item "zstd-${env:ZSTD_VERSION}-win64/include/*.h" "static-php-cli/buildroot/include/"
          Remove-Item -Recurse -Force zstd.zip, "zstd-${env:ZSTD_VERSION}-win64"

      - name: Download php-sdk-binary-tools manually
        working-directory: ${{ github.workspace }}/../static-php-cli
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/php/php-sdk-binary-tools/archive/refs/heads/master.zip" -OutFile sdk.zip
          Expand-Archive -Path sdk.zip -DestinationPath .
          if (Test-Path "php-sdk-binary-tools-master") {
            Rename-Item "php-sdk-binary-tools-master" "php-sdk-binary-tools"
          }
          Remove-Item sdk.zip -Force
          Write-Host "=== SDK installed ==="
          Get-ChildItem "php-sdk-binary-tools/bin" | Select-Object Name | Select-Object -First 10

      - name: Patch PHP 8.3 ext/intl for C++17 (ICU 78 compatibility)
        if: matrix.version == '8.3'
        working-directory: ${{ github.workspace }}/../static-php-cli
        shell: bash
        env:
          PHP_SDK_PATH: ${{ github.workspace }}/../static-php-cli/php-sdk-binary-tools
          SPC_IGNORE_BAD_HASH: "true"
        run: |
          # Extract php-src manually using tar (Git Bash handles .tar.xz)
          rm -rf source/php-src
          mkdir -p source/php-src
          tar --force-local -xf "downloads/php-8.3.33.tar.xz" -C source/php-src --strip-components 1
          
          # Verify extraction
          if [ ! -f source/php-src/ext/intl/config.w32 ]; then
            echo "ERROR: extraction failed"
            ls -la source/php-src/ | head -20
            exit 1
          fi
          
          # Apply patch with sed
          sed -i 's|"/EHsc /DUNISTR_FROM_CHAR_EXPLICIT|"/std:c++17 /EHsc /DUNISTR_FROM_CHAR_EXPLICIT|' source/php-src/ext/intl/config.w32
          
          echo "=== Patch verification ==="
          grep -n 'std:c++17' source/php-src/ext/intl/config.w32 | head -3

      - name: Patch ALL SPC files for VS detection
        working-directory: ${{ github.workspace }}/../static-php-cli
        shell: bash
        run: |
          echo "=== Files before patching ==="
          grep -rl "SystemUtil::findVisualStudio()\['version'\]" src/ 2>/dev/null || echo "No files matched"
          
          # Patch ALL .php files under src/ that use the VS detection pattern
          find src/ -type f -name "*.php" -exec sed -i "s|SystemUtil::findVisualStudio()\['version'\]|'vs17'|g" {} \;
          
          echo ""
          echo "=== Verification: any remaining matches? ==="
          REMAINING=$(grep -rl "SystemUtil::findVisualStudio()\['version'\]" src/ 2>/dev/null | wc -l)
          echo "Remaining files with old pattern: $REMAINING"
          
          if [ "$REMAINING" -gt 0 ]; then
            echo "ERROR: Some files were not patched:"
            grep -rl "SystemUtil::findVisualStudio()\['version'\]" src/ 2>/dev/null
            exit 1
          fi
          
          echo "✅ All files patched successfully"
          
          # Show sample of patched content
          echo ""
          echo "=== Sample: libsodium.php ==="
          sed -n '15,30p' src/SPC/builder/windows/library/libsodium.php 2>/dev/null || true
          
      - name: Build PHP
        working-directory: ${{ github.workspace }}/../static-php-cli
        env:
          SPC_IGNORE_BAD_HASH: "true"
          PHP_SDK_PATH: ${{ github.workspace }}/../static-php-cli/php-sdk-binary-tools
        run: php bin/spc build --build-cli "${{ env.PHP_EXTENSIONS }}" --with-libs="${{ env.PHP_LIBS }}" --debug

      - name: Get built PHP version
        run: |
          $phpVersionFull = ../static-php-cli/buildroot/bin/php.exe -r "echo PHP_VERSION;"
          Add-Content -Path $env:GITHUB_ENV -Value "PHP_VERSION_FULL=$phpVersionFull"

      - name: Create bin directories
        run: |
          New-Item -ItemType Directory -Force -Path "bin/${{ env.SPC_BUILD_OS }}/${{ matrix.arch }}", "license-files", "build-meta" | Out-Null

      - name: Zip PHP binary, copy metadata
        run: |
          Compress-Archive -Path "../static-php-cli/buildroot/bin/php.exe" -DestinationPath "bin/${{ env.SPC_BUILD_OS }}/${{ matrix.arch }}/php-${{ matrix.version }}.zip" -Force
          Copy-Item ../static-php-cli/buildroot/license/* license-files/ -ErrorAction SilentlyContinue
          Copy-Item ../static-php-cli/buildroot/build-extensions.json build-meta/build-extensions-${{ env.SPC_BUILD_OS }}.json -ErrorAction SilentlyContinue
          Copy-Item ../static-php-cli/buildroot/build-libraries.json build-meta/build-libraries-${{ env.SPC_BUILD_OS }}.json -ErrorAction SilentlyContinue

      - name: Upload PHP zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.version }}-win-x64
          path: bin/win/x64/php-${{ matrix.version }}.zip
          retention-days: 30
